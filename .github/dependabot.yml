version: 2
updates:
  # VS Code extension JavaScript/TypeScript toolchain.
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/vscode must stay in sync with the "engines.vscode" range in
      # package.json; bumping it independently breaks `vsce package`.
      - dependency-name: "@types/vscode"

  # Python build-time deps used by the keyword-index generator.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # CI actions — keep SHA pins fresh as upstream tags advance.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
