version: 2
updates:
  # VS Code extension JavaScript/TypeScript toolchain.
  - package-ecosystem: npm
    directory: /vscode-extension
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # @types/vscode must stay within the "engines.vscode" range in
      # package.json (currently ^1.74.0); a minor/major bump breaks
      # `vsce package`. Patch updates are still allowed. When
      # intentionally raising engines.vscode, temporarily remove this
      # ignore rule to let Dependabot propose the matching @types/vscode
      # bump, then restore it.
      - dependency-name: "@types/vscode"
        update-types:
          - "version-update:semver-minor"
          - "version-update:semver-major"

  # Python build-time deps used by the keyword-index generator.
  - package-ecosystem: pip
    directory: /scripts
    schedule:
      interval: weekly
    open-pull-requests-limit: 3

  # CI actions — keep SHA pins fresh as upstream tags advance.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
