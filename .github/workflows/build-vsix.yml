name: Build VSIX

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

# Default least-privilege token scope; jobs that need more elevate explicitly.
permissions:
  contents: read

jobs:
  build-index:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (with submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          submodules: recursive

      - name: Setup Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Run Python tests
        run: pytest scripts/

      - name: Build keyword index
        run: |
          python scripts/build_keyword_index.py \
            --manual-dir opm-reference-manual \
            --opm-common-dir opm-common/opm/input/eclipse/share/keywords \
            --output keyword_index.json \
            --compact vscode-extension/data/keyword_index_compact.json

      - name: Upload keyword index
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: keyword-index
          path: vscode-extension/data/keyword_index_compact.json
          if-no-files-found: error

      # Validate site generation on pull requests too, reusing the full index.
      # Deployment is handled independently by deploy-pages.yml.
      - name: Build documentation site
        run: |
          python scripts/build_keyword_site.py \
            --index keyword_index.json \
            --output site \
            --manual-ref "$(git -C opm-reference-manual rev-parse HEAD)"

  package:
    needs: build-index
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: vscode-extension

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: vscode-extension/package-lock.json

      - name: Download freshly built keyword index
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: keyword-index
          path: vscode-extension/data

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Compile TypeScript
        run: npm run compile

      - name: Package VSIX
        run: npx --yes @vscode/vsce@3.9.1 package

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7
        with:
          name: opm-flow-editor-support-vsix
          path: vscode-extension/opm-flow-editor-support-*.vsix
          if-no-files-found: error

      - name: Attach VSIX to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64  # v3
        with:
          files: vscode-extension/opm-flow-editor-support-*.vsix

  publish-marketplace:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: opm-flow-editor-support-vsix
          path: .

      - name: Publish to VS Code Marketplace
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx --yes @vscode/vsce@3.9.1 publish --packagePath opm-flow-editor-support-*.vsix --pat "$VSCE_PAT"

  publish-ovsx:
    needs: package
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v6
        with:
          node-version: '24'

      - name: Download VSIX
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8
        with:
          name: opm-flow-editor-support-vsix
          path: .

      - name: Publish to Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx --yes ovsx@0.10.12 publish opm-flow-editor-support-*.vsix -p "$OVSX_PAT"
